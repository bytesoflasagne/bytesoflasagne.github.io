<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bytes of Lasagne</title>
    <meta name="description" content="Bytes of Lasagne - a malware analysis blog, coming soon.">
    <style>
        :root {
            --bg: #14110f;
            --fg: #f2e9de;
            --accent: #e8a13a;
            --muted: #9a8f83;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--fg);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 2rem;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin: 0 0 0.5rem;
            letter-spacing: 0.02em;
        }

        h1 span {
            color: var(--accent);
        }

        .tagline {
            color: var(--muted);
            font-size: 1.1rem;
            max-width: 32rem;
            line-height: 1.6;
            margin: 0 0 2rem;
        }

        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            border: 1px solid var(--accent);
            border-radius: 999px;
            color: var(--accent);
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            color: var(--muted);
            font-size: 0.8rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="logo">&#127837;</div>
    <h1>Bytes of <span>Lasagne</span></h1>
    <p class="tagline">
        Reverse engineering, malware teardowns, and threat research &mdash;
        served fresh, one layer at a time.
    </p>
    <span class="status">Coming soon</span>
    <footer>
        <a href="https://github.com/">Bytes of Lasagne</a> &middot; built for GitHub Pages
    </footer>
</body>
</html>
